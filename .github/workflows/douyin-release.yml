name: Douyin nightly release

on:
  schedule:
    # GitHub cron 使用 UTC；北京时间每天 00:17。
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aur-maintenance
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/douyin-devtools-bin
    timeout-minutes: 180
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/douyin-devtools-bin/package-lock.json

      - name: Check upstream version
        id: version
        run: node scripts/check-version.mts update

      - name: Install system dependencies
        if: steps.version.outputs.update_available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            desktop-file-utils \
            imagemagick \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            p7zip-full \
            pkg-config \
            python3
          if ! command -v magick >/dev/null; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi

      - name: Install Node.js dependencies
        if: steps.version.outputs.update_available == 'true'
        run: npm ci --ignore-scripts

      - name: Restore build cache
        if: steps.version.outputs.update_available == 'true'
        uses: actions/cache@v5
        with:
          path: |
            packages/douyin-devtools-bin/.cache/downloads
            packages/douyin-devtools-bin/.cache/electron
            packages/douyin-devtools-bin/.cache/native
            packages/douyin-devtools-bin/.cache/npm
            packages/douyin-devtools-bin/.cache/tools
          key: douyin-devtools-${{ runner.os }}-${{ steps.version.outputs.latest_version }}-${{ hashFiles('packages/douyin-devtools-bin/package-lock.json') }}
          restore-keys: |
            douyin-devtools-${{ runner.os }}-

      - name: Prepare new version configuration
        if: steps.version.outputs.update_available == 'true'
        run: node scripts/prepare-update.mts

      - name: Type check
        if: steps.version.outputs.update_available == 'true'
        run: npm run typecheck

      - name: Build and audit runnable directory
        if: steps.version.outputs.update_available == 'true'
        run: node scripts/build.mts --version "${{ steps.version.outputs.latest_version }}"

      - name: Build AppImage
        if: steps.version.outputs.update_available == 'true'
        run: node scripts/appimage.mts --version "${{ steps.version.outputs.latest_version }}"

      - name: Create or update GitHub Release
        if: steps.version.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.latest_version }}
        run: |
          appimage="dist/DouyinDevTools-${VERSION}-x86_64.AppImage"
          checksum="${appimage}.sha256"
          tag="$(jq -r '.arch.githubTagPrefix' configs/packaging.json)${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$appimage" "$checksum" --clobber
          else
            gh release create "$tag" "$appimage" "$checksum" \
              --title "抖音开发者工具 ${VERSION} Linux" \
              --generate-notes
          fi

      - name: Promote version and push generated configuration
        if: steps.version.outputs.update_available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.latest_version }}
        run: |
          node scripts/check-version.mts promote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            configs/releases.json \
            "configs/versions/${VERSION}.json" \
            "templates/patches/${VERSION}.json"
          if git diff --cached --quiet; then
            echo "No generated version changes to commit."
            exit 0
          fi
          git commit -m "chore: update Douyin DevTools to ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
