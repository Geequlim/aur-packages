name: Auto Update

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Recheck the current release and increment pkgrel
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aur-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel ca-certificates git jq curl aria2 openssh util-linux
          useradd -m builder

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update packaging
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env FORCE="$FORCE" GITHUB_TOKEN="$GITHUB_TOKEN" ./scripts/update.sh

      - name: Commit and push packaging changes
        run: |
          set -euo pipefail
          runuser -u builder -- bash -euo pipefail -c '
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD .SRCINFO
            if ! git diff --cached --quiet; then
              version=$(sed -n "s/^pkgver=//p" PKGBUILD)
              git commit -m "chore: update to ${version}"
              git push origin HEAD
            fi
          '

      - name: Synchronize AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'Missing AUR_SSH_PRIVATE_KEY secret' >&2
            exit 1
          fi
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/{aur,known_hosts}
          export GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts'
          export PACKAGE_DIR="$GITHUB_WORKSPACE"
          runuser -u builder --preserve-environment -- bash -euo pipefail -c '
            aur_url=ssh://aur@aur.archlinux.org/t3-code-cli-bin.git
            if ! git clone "$aur_url" /home/builder/aur-repo; then
              count=$(curl -fsSL --retry 3 "https://aur.archlinux.org/rpc/v5/info?arg%5B%5D=t3-code-cli-bin" | jq -er ".resultcount")
              [[ "$count" == 0 ]] || { echo "Failed to clone existing AUR repository" >&2; exit 1; }
              rm -rf /home/builder/aur-repo
              git init -b master /home/builder/aur-repo
              git -C /home/builder/aur-repo remote add origin "$aur_url"
            fi
            cd /home/builder/aur-repo
            cp "$PACKAGE_DIR/PKGBUILD" "$PACKAGE_DIR/.SRCINFO" .
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "AUR already up to date"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            version=$(sed -n "s/^pkgver=//p" PKGBUILD)
            git commit -m "chore: update to ${version}"
            git push origin HEAD:master
          '
